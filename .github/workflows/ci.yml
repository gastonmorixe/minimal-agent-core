name: CI

# Full gate on pull requests and on direct pushes to the long-lived branch.
# `release.yml` also runs the gate before cutting a release, so this workflow
# stays focused on fast feedback for everyday work.
#
# Commitlint enforces Conventional Commits (same rules as local Husky hook).
on:
  push:
    branches:
      - main
    tags-ignore:
      - "**" # tag pushes are handled by release.yml, not here
  pull_request:
    branches:
      - main

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Validate current commit (push)
        if: github.event_name == 'push'
        run: bun run commitlint:last

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: bunx --bun commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  check:
    name: bun run check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      # The one gate: typecheck, lint, format, import-sort, docs, architecture
      # invariants, then the full test suite. Stops at the first failure.
      - name: Run check
        run: bun run check
