name: CI

# Commitlint only. The full gate (typecheck, lint, format, biome, tests, docs, arch tests)
# runs in the umbrella repo gastonmorixe/minimal-agent, which checks out every
# submodule with SUBMODULES_PAT and runs core, plugins, cli and web together.
# Bump this repo's pin there to gate a change.
#
# Why no `bun install` here: @minimal-agent/config is a git dependency on a
# private repo, and this workflow's GITHUB_TOKEN cannot read other private
# repos. So the job installs ONLY the commitlint packages this repo pins in
# package.json, then lints with this repo's own commitlint.config.js.
on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install commitlint only
        run: |
          set -euo pipefail
          # Keep only the pinned commitlint devDependencies. Everything else
          # (the private core git dependency, workspaces, prepare/husky) is
          # dropped from this throwaway CI checkout.
          jq '{name, private: true, type,
               devDependencies: (.devDependencies
                 | with_entries(select(.key | startswith("@commitlint/"))))}' \
            package.json > "${RUNNER_TEMP}/package.json"
          cat "${RUNNER_TEMP}/package.json"
          mv "${RUNNER_TEMP}/package.json" package.json
          rm -f bun.lock bun.lockb
          bun install --no-save

      - name: Validate current commit (push)
        if: github.event_name == 'push'
        run: bunx --bun commitlint --last --verbose

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: bunx --bun commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
